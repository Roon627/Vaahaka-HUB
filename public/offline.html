<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c2330">
<title>Offline · Ihusaas</title>
<!-- Standalone on purpose: the service worker serves this when a page can't be reached, so it must not depend on JS frameworks or hydration. -->
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0a1c26}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(1.5rem,env(safe-area-inset-top)) 1.5rem max(1.5rem,env(safe-area-inset-bottom));
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f5efe4;
    background:radial-gradient(40rem 24rem at 85% -5%,rgba(247,213,142,.12),transparent 60%),linear-gradient(180deg,#17475a 0%,#0c2330 55%,#081923 100%)}
  main{max-width:26rem;text-align:center}
  img{width:120px;height:auto;animation:bob 6s ease-in-out infinite}
  h1{font:300 1.9rem/1.2 ui-serif,Georgia,serif;margin:1.25rem 0 .6rem}
  p{color:#9db9b8;line-height:1.6;margin:0 0 1.25rem}
  button{font:600 .95rem inherit;font-family:inherit;border:0;border-radius:999px;padding:.85rem 1.8rem;min-height:48px;color:#0a1c26;cursor:pointer;
    background:linear-gradient(90deg,#9fe3d0,#ecd9b5);box-shadow:0 0 34px -8px rgba(159,227,208,.45)}
  .help{margin-top:1.75rem;padding:1rem 1.1rem;border-radius:1.25rem;border:1px solid rgba(244,165,149,.28);background:rgba(244,165,149,.08);font-size:.85rem;line-height:1.5;color:#f5efe4;text-align:left}
  .help strong{color:#f4a595;font-weight:500}
  .help a{color:#f5efe4;font-weight:600}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(2deg)}}
  @media (prefers-reduced-motion:reduce){img{animation:none}}
</style>
</head>
<body>
<main>
  <img src="/brand/stickers/sad.svg" alt="" width="120" height="144">
  <h1>The sea is out of reach</h1>
  <p>You're offline, so the bottles can't drift in. Check your connection and we'll be right here.</p>
  <button onclick="location.reload()">Try again</button>
  <div class="help">
    <strong>Need someone right now?</strong> Free, confidential, 24 hours: the national mental health helpline on <a href="tel:1677">1677</a>.
    In an emergency call <a href="tel:911">911</a>. Calls work without data.
    <a href="/help">All helplines</a>
  </div>
</main>
</body>
</html>
